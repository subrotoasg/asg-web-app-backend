<title>পাইপলাইন এনিমেশন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@600;700&family=Hind+Siliguri:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ============================================================
   MECHANISM PLAYER — a step-driven animation of the real
   request, cache and job lifecycles in this backend.
   Colour is identity, not decoration:
     teal   = Redis          violet = PostgreSQL
     amber  = work in flight rose   = a miss or a failure
     green  = a hit or a success
   Committed single-theme dark: built to be screen-recorded.
   ============================================================ */
:root{
  --ground:#0B0E15;
  --panel:#151A26;
  --panel-2:#1B2130;
  --line:#28303F;
  --line-soft:#1D2431;
  --ink:#E9EDF6;
  --ink-2:#AEB7C9;
  --muted:#7A8496;
  --redis:#3FC9C0;
  --redis-dim:#1C6D68;
  --pg:#9A8CF0;
  --pg-dim:#463C82;
  --work:#F5A63C;
  --work-dim:#8A5F22;
  --bad:#E2607A;
  --bad-dim:#7A3448;
  --ok:#7BD88F;
  --ok-dim:#2E6B44;
}
*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.player{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(115% 85% at 82% 4%, rgba(63,201,192,.09), transparent 58%),
    radial-gradient(95% 80% at 8% 98%, rgba(245,166,60,.08), transparent 60%),
    var(--ground);
  --u:1vw;
  overflow:hidden;
}
@supports (container-type:size){ .player{container-type:size; --u:1cqw} }

/* ---------- header: scene index ---------- */
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:calc(var(--u) * 2);
  padding:calc(var(--u) * 2.0) calc(var(--u) * 3.0) calc(var(--u) * 1.0);
  flex:0 0 auto;
}
.who{display:flex;flex-direction:column;gap:calc(var(--u) * .3);min-width:0}
.who .eye{
  font-family:"JetBrains Mono",monospace;
  font-size:calc(var(--u) * .82);
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--redis);
}
.who h1{
  font-family:"Anek Bangla","Hind Siliguri",sans-serif;
  font-size:calc(var(--u) * 2.15);
  font-weight:700;
  margin:0;
  line-height:1.15;
  letter-spacing:-.01em;
}
.who p{margin:0;font-size:calc(var(--u) * 1.02);color:var(--ink-2);font-weight:300}

.scenes{display:flex;gap:calc(var(--u) * .38);justify-content:flex-end;flex-wrap:wrap;max-width:46%}
.sc{
  font-family:"JetBrains Mono",monospace;
  font-size:calc(var(--u) * .78);
  padding:calc(var(--u) * .34) calc(var(--u) * .72);
  border:1px solid var(--line);
  border-radius:99px;
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  white-space:nowrap;
  transition:color .2s, border-color .2s, background .2s;
}
.sc:hover{color:var(--ink-2);border-color:var(--redis-dim)}
.sc.on{color:var(--ground);background:var(--redis);border-color:var(--redis);font-weight:700}

/* ---------- the stage ---------- */
.stage{flex:1 1 auto;min-height:0;padding:0 calc(var(--u) * 2.2)}
svg.world{width:100%;height:100%;display:block;overflow:visible}

/* nodes */
.nd rect{
  fill:var(--panel);
  stroke:var(--line);
  stroke-width:1.5;
  transition:stroke .35s, fill .35s;
}
.nd .kick{fill:var(--muted);font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:1.6px}
.nd .nm{fill:var(--ink);font-family:"Hind Siliguri",sans-serif;font-size:23px;font-weight:600}
.nd .nm.mono{font-family:"JetBrains Mono",monospace;font-size:19px;font-weight:500}
.nd .sb{fill:var(--ink-2);font-family:"Hind Siliguri",sans-serif;font-size:17px;font-weight:300}
.nd.k-redis rect{stroke:var(--redis-dim)} .nd.k-redis .kick{fill:var(--redis)}
.nd.k-pg    rect{stroke:var(--pg-dim)}    .nd.k-pg .kick{fill:var(--pg)}
.nd.k-work  rect{stroke:var(--work-dim)}  .nd.k-work .kick{fill:var(--work)}
.nd.dim rect{stroke:var(--line-soft);fill:#10141D}
.nd.dim .nm,.nd.dim .sb{fill:#4E5668}
.nd.dim .kick{fill:#4E5668}
/* the node the current step is acting on */
.nd.hot rect{stroke:var(--redis);fill:var(--panel-2)}
.nd.hot.k-pg rect{stroke:var(--pg)}
.nd.hot.k-work rect{stroke:var(--work)}
.nd.bad rect{stroke:var(--bad);fill:#1F1520}
.nd.good rect{stroke:var(--ok)}
.nd.hot .glow,.nd.bad .glow,.nd.good .glow{opacity:1}
.glow{opacity:0;transition:opacity .35s}
.nd.hot .glow{stroke:var(--redis)}
.nd.hot.k-pg .glow{stroke:var(--pg)}
.nd.hot.k-work .glow{stroke:var(--work)}
.nd.bad .glow{stroke:var(--bad)}
.nd.good .glow{stroke:var(--ok)}

/* edges — the topology is always visible, the active hop lights up */
.eg line,.eg path{stroke:var(--line);stroke-width:2;fill:none;transition:stroke .3s,stroke-width .3s,opacity .3s}
.eg text{fill:#6E7889;font-family:"JetBrains Mono",monospace;font-size:17px;transition:fill .3s}
.eg .head{fill:var(--line);transition:fill .3s}
.eg.on line,.eg.on path{stroke:var(--work);stroke-width:3}
.eg.on text{fill:var(--work)}
.eg.on .head{fill:var(--work)}
.eg.on-r line,.eg.on-r path{stroke:var(--redis);stroke-width:3}
.eg.on-r text{fill:var(--redis)} .eg.on-r .head{fill:var(--redis)}
.eg.on-b line,.eg.on-b path{stroke:var(--bad);stroke-width:3}
.eg.on-b text{fill:var(--bad)} .eg.on-b .head{fill:var(--bad)}
.eg.on-g line,.eg.on-g path{stroke:var(--ok);stroke-width:3}
.eg.on-g text{fill:var(--ok)} .eg.on-g .head{fill:var(--ok)}
.eg.off{opacity:.4}
.eg.dash line,.eg.dash path{stroke-dasharray:7 7}

/* tokens — the things that actually move */
.tok{transition:transform var(--tdur,.62s) cubic-bezier(.32,.78,.32,1), opacity .3s;}
.tok circle{stroke-width:2}
.tok text{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:700;text-anchor:middle}
.tok.gone{opacity:0}
.tok.t-req circle{fill:var(--work);stroke:var(--work)} .tok.t-req text{fill:#141821}
.tok.t-job circle{fill:var(--work);stroke:var(--work)} .tok.t-job text{fill:#141821}
.tok.t-wait circle{fill:none;stroke:var(--work)} .tok.t-wait text{fill:var(--work)}
.tok.t-ok  circle{fill:var(--ok);stroke:var(--ok)}   .tok.t-ok text{fill:#0F1A13}
.tok.t-bad circle{fill:var(--bad);stroke:var(--bad)} .tok.t-bad text{fill:#1E1015}
.tok.t-redis circle{fill:var(--redis);stroke:var(--redis)} .tok.t-redis text{fill:#0D1A19}
.tok.t-pg circle{fill:var(--pg);stroke:var(--pg)} .tok.t-pg text{fill:#12101E}
.tok.pulse circle{animation:tpulse 1.1s ease-in-out infinite}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.35}}
.tok.spin{animation:torbit 1.3s linear infinite}
@keyframes torbit{to{}}

/* the running tally — the payoff, kept on screen */
.tally text{font-family:"JetBrains Mono",monospace}
.tally .tl{fill:var(--muted);font-size:17px;letter-spacing:1.6px}
.tally .tv{font-size:40px;font-weight:700}
.tally .tv.db{fill:var(--pg)}
.tally .tv.rd{fill:var(--redis)}

/* ---------- caption ---------- */
.cap{
  flex:0 0 auto;
  padding:calc(var(--u) * 1.0) calc(var(--u) * 3.0) calc(var(--u) * .6);
  display:flex;
  gap:calc(var(--u) * 1.4);
  align-items:flex-start;
  min-height:calc(var(--u) * 8.4);
}
.cap .num{
  flex:0 0 auto;
  font-family:"JetBrains Mono",monospace;
  font-size:calc(var(--u) * 1.0);
  color:var(--work);
  border:1px solid var(--work-dim);
  border-radius:calc(var(--u) * .3);
  padding:calc(var(--u) * .22) calc(var(--u) * .6);
  margin-top:calc(var(--u) * .3);
  letter-spacing:.05em;
}
.cap .body{display:flex;flex-direction:column;gap:calc(var(--u) * .5);min-width:0;flex:1}
.cap .txt{
  font-size:calc(var(--u) * 1.62);
  line-height:1.45;
  color:var(--ink);
  font-weight:300;
  max-width:78ch;
}
.cap .txt b{font-weight:600;color:var(--ink)}
.cap .txt em{font-style:normal;color:var(--work);font-weight:500}
.cap .code{
  font-family:"JetBrains Mono",monospace;
  font-size:calc(var(--u) * 1.02);
  color:var(--redis);
  background:#0A0D14;
  border:1px solid var(--line);
  border-left:2px solid var(--redis);
  border-radius:calc(var(--u) * .25);
  padding:calc(var(--u) * .38) calc(var(--u) * .8);
  align-self:flex-start;
  max-width:100%;
  overflow-x:auto;
  white-space:pre;
}

/* ---------- transport ---------- */
.bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:calc(var(--u) * 1.1);
  padding:0 calc(var(--u) * 3.0) calc(var(--u) * 1.3);
}
.btn{
  font-family:"JetBrains Mono",monospace;
  font-size:calc(var(--u) * .92);
  color:var(--ink-2);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:calc(var(--u) * .32);
  padding:calc(var(--u) * .42) calc(var(--u) * .9);
  cursor:pointer;
  transition:color .2s,border-color .2s;
  white-space:nowrap;
}
.btn:hover{color:var(--ink);border-color:var(--redis-dim)}
.btn:focus-visible{outline:2px solid var(--redis);outline-offset:2px}
.btn.play{color:var(--ground);background:var(--redis);border-color:var(--redis);font-weight:700;min-width:calc(var(--u) * 7)}
.ticks{display:flex;gap:calc(var(--u) * .22);flex:1;align-items:center;min-width:0}
.tk{
  flex:1 1 auto;
  height:calc(var(--u) * .34);
  background:var(--line);
  border-radius:99px;
  cursor:pointer;
  transition:background .25s;
  min-width:calc(var(--u) * .3);
}
.tk.done{background:var(--redis-dim)}
.tk.on{background:var(--work)}
.hint{
  font-family:"JetBrains Mono",monospace;
  font-size:calc(var(--u) * .78);
  color:var(--muted);
  white-space:nowrap;
}

@media (prefers-reduced-motion:reduce){
  .tok{transition:none}
  .tok.pulse circle{animation:none}
}
</style>

<div class="player" id="player">
  <header class="top">
    <div class="who">
      <span class="eye" id="eyebrow">MECHANISM · বাংলা</span>
      <h1 id="sceneTitle">—</h1>
      <p id="sceneSub">—</p>
    </div>
    <nav class="scenes" id="sceneNav" aria-label="দৃশ্য"></nav>
  </header>

  <div class="stage">
    <svg class="world" id="world" viewBox="0 0 1600 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="worldTitle">
      <title id="worldTitle">চলমান ডায়াগ্রাম — রিকোয়েস্ট, ক্যাশ আর জব কোন পথে যায়</title>
      <g id="edges"></g>
      <g id="nodes"></g>
      <g id="tokens"></g>
      <g id="tally" class="tally"></g>
    </svg>
  </div>

  <div class="cap">
    <span class="num" id="stepNum">০১</span>
    <div class="body">
      <p class="txt" id="capText">—</p>
      <code class="code" id="capCode" hidden></code>
    </div>
  </div>

  <div class="bar">
    <button class="btn play" id="playBtn" type="button">▶ চালাও</button>
    <button class="btn" id="prevBtn" type="button">◀ আগের</button>
    <button class="btn" id="nextBtn" type="button">পরের ▶</button>
    <div class="ticks" id="ticks"></div>
    <button class="btn" id="speedBtn" type="button">১× গতি</button>
    <span class="hint">Space চালাও · ← → ধাপ · ১–৮ দৃশ্য</span>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══ helpers for declaring a scene ══════════════════════════ */
const NW = 268, NH = 96;                       // node box size, in viewBox units
const N = (id, x, y, kick, nm, sb, o = {}) =>
  ({ id, x, y, kick, nm, sb, kind: o.kind || "", mono: !!o.mono, w: o.w || NW, h: o.h || NH, dim: !!o.dim });
const E = (a, b, label, o = {}) => ({ a, b, label, side: o.side || "top", bend: o.bend || 0, dash: !!o.dash });
const T = (id, label, kind) => ({ id, label, kind });

/* a step: caption, optional code line, node/edge highlights, token placement */
const S = (cap, o = {}) => ({
  cap, code: o.code || null, d: o.d || 3400,
  hot: o.hot || [], bad: o.bad || [], good: o.good || [],
  on: o.on || [], onR: o.onR || [], onB: o.onB || [], onG: o.onG || [],
  at: o.at || {},            // tokenId -> nodeId | [x,y] | null (hidden)
  cls: o.cls || {},          // tokenId -> extra class
  tally: o.tally || null,    // { db, redis }
});

const anchor = (n, where) => {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  if (where === "l") return [n.x, cy];
  if (where === "r") return [n.x + n.w, cy];
  if (where === "t") return [cx, n.y];
  if (where === "b") return [cx, n.y + n.h];
  return [cx, cy];
};

/* ══ shared layouts ═════════════════════════════════════════ */
const L_cache = (first) => [
  first,
  N("api", 420, 250, "API · PM2 #3", "getOrLoadCache(key)", "cache-aside লজিক", { mono: true }),
  N("rds", 860,  90, "REDIS", "cache:notification:v1:list:…", "envelope · freshUntil", { kind: "k-redis", mono: true }),
  N("pg",  860, 410, "POSTGRESQL", "findMany + count ×3", "আসল কোয়েরি — দামি", { kind: "k-pg" }),
];
const E_cache = [
  E("cli", "api", "HTTP"),
  E("api", "rds", "GET key"),
  E("api", "pg",  "কোয়েরি", { dash: true }),
];

/* ══ THE SCENES ═════════════════════════════════════════════ */
const SCENES = [

/* ── 1 ── the 95% path ───────────────────────────────────── */
{
  id: "hit", tab: "১ · হিট",
  title: "ক্যাশ হিট — ডাটাবেজ ছোঁয়াই লাগে না",
  sub: "প্রতি ১০০টা রিকোয়েস্টের প্রায় ৯৫টা এই পথেই শেষ হয়",
  nodes: L_cache(N("cli", 30, 250, "CLIENT", "GET /my-notification", "স্টুডেন্ট অ্যাপ খুললো")),
  edges: E_cache,
  tokens: [T("r", "R", "t-req")],
  steps: [
    S("একটা স্টুডেন্ট অ্যাপ খুললো। রিকোয়েস্টটা লোড ব্যালেন্সার ঘুরে <em>ছয়টা PM2 ইনস্ট্যান্সের যেকোনো একটায়</em> পড়লো।",
      { hot: ["cli"], on: [], at: { r: { n: "cli" } }, tally: { db: 0, rd: 0 } }),
    S("API সরাসরি ডাটাবেজে যায় না। প্রথমে <b>ক্যাশ key</b> বানায় — রোল, ইউজার আইডি, হোস্ট, কোয়েরির হ্যাশ, আর দুইটা ভার্সন নম্বর মিলে।",
      { code: 'cache:notification:v1:list:student:a91f…:frb:7c2f:g42:u3',
        hot: ["api"], on: ["cli>api"], at: { r: { n: "api" } }, tally: { db: 0, rd: 0 } }),
    S("<em>একটাই</em> Redis কমান্ড যায় — <b>GET</b>। খেয়াল করো, নিচের ডাটাবেজের রাস্তাটা এখনো ছোঁয়াই হয়নি।",
      { hot: ["rds"], onR: ["api>rds"], at: { r: { n: "rds" } }, cls: { r: "pulse" }, tally: { db: 0, rd: 1 } }),
    S("Redis খামটা ফেরত দিলো। API ভেতরের <b>freshUntil</b> দেখে — এখনকার সময় তার চেয়ে ছোট, তাই অবস্থা <em>FRESH</em>।",
      { code: '{ "version": 1, "freshUntil": 1756800000000, "value": {…} }',
        good: ["rds"], onR: ["api>rds"], at: { r: { n: "rds" } }, tally: { db: 0, rd: 1 } }),
    S("ভ্যালুটা সাথে সাথে ইউজারের কাছে চলে গেল। <b>মোট খরচ: একটা Redis GET</b> — ডাটাবেজে একটাও কোয়েরি যায়নি।",
      { good: ["api", "cli"], onG: ["api>rds", "cli>api"], at: { r: { n: "cli" } },
        cls: { r: "t-ok" }, tally: { db: 0, rd: 1 }, d: 4200 }),
  ],
},

/* ── 2 ── the centrepiece ────────────────────────────────── */
{
  id: "miss", tab: "২ · মিস + লক",
  title: "ক্যাশ মিস — ছয়টা রিকোয়েস্ট, একটাই DB কোয়েরি",
  sub: "singleFlight, Redis লক আর পোলিং — তিনটা স্তর একসাথে কাজ করছে",
  nodes: [
    N("p1",  40,  40, "API · PM2 #1", "৩টা রিকোয়েস্ট", "একই key চাইছে", { w: 300 }),
    N("p2",  40, 215, "API · PM2 #2", "২টা রিকোয়েস্ট", "একই key চাইছে", { w: 300 }),
    N("p3",  40, 390, "API · PM2 #3", "১টা রিকোয়েস্ট", "একই key চাইছে", { w: 300 }),
    N("lock", 610,  40, "REDIS", "SET lock:… tok PX 5000 NX", "একজনই OK পায়", { kind: "k-redis", w: 340, mono: true }),
    N("cache", 610, 260, "REDIS", "cache:…:list:…:g42:u3", "এখন খালি — miss", { kind: "k-redis", w: 340, mono: true }),
    N("pg", 1150, 260, "POSTGRESQL", "findMany + count ×3", "~১৮০ms লাগে", { kind: "k-pg", w: 300 }),
  ],
  edges: [
    E("p1", "lock", "SET NX"), E("p2", "lock", "SET NX"), E("p3", "lock", "SET NX"),
    E("cache", "pg", "লোডার"), E("p2", "cache", "poll", { dash: true }), E("p3", "cache", "poll", { dash: true }),
  ],
  tokens: [T("a", "1", "t-req"), T("b", "2", "t-req"), T("c", "3", "t-req"),
           T("d", "4", "t-req"), T("e", "5", "t-req"), T("f", "6", "t-req")],
  steps: [
    S("ক্যাশ এইমাত্র এক্সপায়ার করলো। ঠিক সেই মুহূর্তে <b>ছয়টা রিকোয়েস্ট</b> একই key চাইলো — তিনটা প্রসেসে ছড়িয়ে।",
      { hot: ["p1", "p2", "p3"], bad: ["cache"],
        at: { a: { n: "p1", dx: -70 }, b: { n: "p1" }, c: { n: "p1", dx: 70 },

/* ══ ENGINE ═════════════════════════════════════════════════ */
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
const $ = (id) => document.getElementById(id);
const bn = (v) => String(v).replace(/\d/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);

const gEdges = $("edges"), gNodes = $("nodes"), gToks = $("tokens"), gTally = $("tally");
const capText = $("capText"), capCode = $("capCode"), stepNum = $("stepNum");
const ticksBox = $("ticks"), sceneNav = $("sceneNav");

let si = 0, ki = 0, playing = false, timer = null, speed = 1;
let map = {}, nodeEls = {}, edgeEls = {}, tokEls = {};

/* shrink a label until it fits inside its box */
function fit(t, maxW, start) {
  let size = start;
  while (size > 11 && t.getComputedTextLength() > maxW) {
    size -= 1;
    t.setAttribute("font-size", size);
  }
}

function anchors(a, b) {
  const acx = a.x + a.w / 2, acy = a.y + a.h / 2;
  const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  const dx = bcx - acx, dy = bcy - acy;
  if (Math.abs(dx) >= Math.abs(dy)) {
    return dx > 0
      ? [[a.x + a.w, acy], [b.x, bcy]]
      : [[a.x, acy], [b.x + b.w, bcy]];
  }
  return dy > 0
    ? [[acx, a.y + a.h], [bcx, b.y]]
    : [[acx, a.y], [bcx, b.y + b.h]];
}

function buildScene(sc) {
  gEdges.textContent = ""; gNodes.textContent = ""; gToks.textContent = ""; gTally.textContent = "";
  map = {}; nodeEls = {}; edgeEls = {}; tokEls = {};
  sc.nodes.forEach((n) => (map[n.id] = n));

  /* edges first, so nodes paint over their endpoints */
  sc.edges.forEach((e) => {
    const A = map[e.a], B = map[e.b];
    if (!A || !B) return;
    const [[x1, y1], [x2, y2]] = anchors(A, B);
    const g = el("g", { class: "eg" + (e.dash ? " dash" : "") });
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const hx = x2 - Math.cos(ang) * 13, hy = y2 - Math.sin(ang) * 13;
    g.appendChild(el("line", { x1, y1, x2: hx, y2: hy }));
    g.appendChild(el("polygon", {
      class: "head", points: "0,-7 14,0 0,7",
      transform: `translate(${hx} ${hy}) rotate(${(ang * 180) / Math.PI})`,
    }));
    if (e.label) {
      const t = el("text", {
        x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 12, "text-anchor": "middle",
      });
      t.textContent = e.label;
      g.appendChild(t);
    }
    gEdges.appendChild(g);
    edgeEls[`${e.a}>${e.b}`] = g;
  });

  /* nodes */
  sc.nodes.forEach((n) => {
    const g = el("g", { class: "nd " + (n.kind || "") + (n.dim ? " dim" : "") });
    g.appendChild(el("rect", { class: "glow", x: n.x - 5, y: n.y - 5, width: n.w + 10, height: n.h + 10, rx: 13, fill: "none", "stroke-width": 2 }));
    g.appendChild(el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 9 }));
    const pad = 18, inner = n.w - pad * 2;
    const k = el("text", { class: "kick", x: n.x + pad, y: n.y + 27 }); k.textContent = n.kick;
    const m = el("text", { class: "nm" + (n.mono ? " mono" : ""), x: n.x + pad, y: n.y + 57 }); m.textContent = n.nm;
    const s = el("text", { class: "sb", x: n.x + pad, y: n.y + 81 }); s.textContent = n.sb;
    g.append(k, m, s);
    gNodes.appendChild(g);
    fit(k, inner, 15); fit(m, inner, n.mono ? 19 : 23); fit(s, inner, 17);
    nodeEls[n.id] = { g, dim: n.dim };
  });

  /* tokens */
  (sc.tokens || []).forEach((t) => {
    const g = el("g", { class: `tok ${t.kind}` });
    g.appendChild(el("circle", { r: 18, cx: 0, cy: 0 }));
    const tx = el("text", { x: 0, y: 5 }); tx.textContent = t.label;
    g.appendChild(tx);
    gToks.appendChild(g);
    tokEls[t.id] = { g, base: t.kind };
  });

  /* the running tally, bottom-left, only where a step declares one */
  if (sc.steps.some((s) => s.tally)) {
    const mk = (x, label, cls, id) => {
      const l = el("text", { class: "tl", x, y: 558 }); l.textContent = label;
      const v = el("text", { class: "tv " + cls, x, y: 598, id });
      v.textContent = "0";
      gTally.append(l, v);
      return v;
    };
    gTally.dbEl = mk(22, "DB কোয়েরি", "db", "tallyDb");
    gTally.rdEl = mk(240, "REDIS কমান্ড", "rd", "tallyRd");
  }
}

function applyStep(sc, i) {
  const st = sc.steps[i];

  for (const id in nodeEls) {
    const { g, dim } = nodeEls[id];
    g.setAttribute("class", "nd " + (map[id].kind || "") +
      (dim ? " dim" : "") +
      (st.hot.includes(id) ? " hot" : "") +
      (st.bad.includes(id) ? " bad" : "") +
      (st.good.includes(id) ? " good" : ""));
  }

  for (const key in edgeEls) {
    const g = edgeEls[key];
    const base = g.classList.contains("dash") ? "eg dash" : "eg";
    g.setAttribute("class", base +
      (st.on.includes(key) ? " on" :
       st.onR.includes(key) ? " on-r" :
       st.onB.includes(key) ? " on-b" :
       st.onG.includes(key) ? " on-g" : " off"));
  }

  const placed = [];
  for (const id in tokEls) {
    const { g, base } = tokEls[id];
    const spot = st.at[id];
    const extra = st.cls[id] || "";
    g.setAttribute("class", "tok " + (extra.includes("t-") ? extra : base + " " + extra));
    if (!spot) { g.classList.add("gone"); continue; }
    let x, y;
    if (spot.n) {
      const n = map[spot.n];
      x = n.x + n.w / 2 + (spot.dx || 0);
      y = n.y + n.h + 27 + (spot.dy || 0);   // under the box, never over its text
    } else { x = spot.x; y = spot.y; }
    placed.push({ g, x, y, hidden: g.classList.contains("gone") });
  }

  /* two tokens resolving to the same spot would sit on top of each other —
     fan any such group out horizontally so every one stays readable */
  const groups = new Map();
  placed.forEach((t) => {
    if (t.hidden) return;
    const key = `${Math.round(t.x)}:${Math.round(t.y)}`;
    (groups.get(key) || groups.set(key, []).get(key)).push(t);
  });
  groups.forEach((g) => {
    if (g.length < 2) return;
    g.forEach((t, i) => (t.x += (i - (g.length - 1) / 2) * 44));
  });
  placed.forEach((t) => (t.g.style.transform = `translate(${t.x}px, ${t.y}px)`));

  if (gTally.dbEl && st.tally) {
    gTally.dbEl.textContent = bn(st.tally.db);
    gTally.rdEl.textContent = bn(st.tally.rd);
  }

  capText.innerHTML = st.cap;
  if (st.code) { capCode.textContent = st.code; capCode.hidden = false; }
  else capCode.hidden = true;
  stepNum.textContent = `${bn(String(i + 1).padStart(2, "0"))}/${bn(sc.steps.length)}`;

  [...ticksBox.children].forEach((t, n) => {
    t.className = "tk" + (n === i ? " on" : n < i ? " done" : "");
  });
}

function loadScene(n, keepPlaying) {
  si = (n + SCENES.length) % SCENES.length;
  const sc = SCENES[si];
  $("sceneTitle").textContent = sc.title;
  $("sceneSub").textContent = sc.sub;
  [...sceneNav.children].forEach((b, i) => b.classList.toggle("on", i === si));
  buildScene(sc);
  ticksBox.textContent = "";
  sc.steps.forEach((_, i) => {
    const t = document.createElement("button");
    t.className = "tk"; t.type = "button";
    t.setAttribute("aria-label", `ধাপ ${i + 1}`);
    t.addEventListener("click", () => { stop(); ki = i; applyStep(sc, ki); });
    ticksBox.appendChild(t);
  });
  ki = 0;
  /* first frame with motion off, so the scene opens composed */
  gToks.style.setProperty("--tdur", "0s");
  applyStep(sc, 0);
  requestAnimationFrame(() => gToks.style.setProperty("--tdur", ".62s"));
  if (keepPlaying && playing) queue();
}

function queue() {
  clearTimeout(timer);
  const sc = SCENES[si];
  timer = setTimeout(() => {
    if (ki < sc.steps.length - 1) { ki++; applyStep(sc, ki); queue(); }
    else if (si < SCENES.length - 1) { loadScene(si + 1, true); }
    else stop();
  }, (sc.steps[ki].d || 3400) / speed);
}

function play() { playing = true; $("playBtn").textContent = "❚❚ থামাও"; queue(); }
function stop() { playing = false; $("playBtn").textContent = "▶ চালাও"; clearTimeout(timer); }
function stepBy(d) {
  stop();
  const sc = SCENES[si];
  const next = ki + d;
  if (next < 0) { if (si > 0) { loadScene(si - 1); ki = SCENES[si].steps.length - 1; applyStep(SCENES[si], ki); } return; }
  if (next >= sc.steps.length) { if (si < SCENES.length - 1) loadScene(si + 1); return; }
  ki = next; applyStep(sc, ki);
}

/* ── wiring ── */
SCENES.forEach((sc, i) => {
  const b = document.createElement("button");
  b.className = "sc"; b.type = "button"; b.textContent = sc.tab;
  b.addEventListener("click", () => { const was = playing; stop(); loadScene(i); if (was) play(); });
  sceneNav.appendChild(b);
});

$("playBtn").addEventListener("click", () => (playing ? stop() : play()));
$("prevBtn").addEventListener("click", () => stepBy(-1));
$("nextBtn").addEventListener("click", () => stepBy(1));
$("speedBtn").addEventListener("click", () => {
  const rates = [1, 1.5, 2, 0.6];
  speed = rates[(rates.indexOf(speed) + 1) % rates.length];
  $("speedBtn").textContent = `${bn(String(speed).replace(".", "."))}× গতি`;
  if (playing) queue();
});

document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === " ") { e.preventDefault(); playing ? stop() : play(); }
  else if (k === "ArrowRight") { e.preventDefault(); stepBy(1); }
  else if (k === "ArrowLeft") { e.preventDefault(); stepBy(-1); }
  else if (k === "f" || k === "F") {
    document.fullscreenElement ? document.exitFullscreen() : $("player").requestFullscreen?.();
  } else if (/^[1-8]$/.test(k)) {
    const n = Number(k) - 1;
    if (n < SCENES.length) { const was = playing; stop(); loadScene(n); if (was) play(); }
  }
});

loadScene(0);
})();
</script>
