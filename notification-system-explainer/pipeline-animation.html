<title>৫ লাখ ইউজারের গল্প</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@600;700&family=Hind+Siliguri:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ============================================================
   ৫ লাখ ইউজারের গল্প — একটা চেইন।
   একটা সমস্যা → তার সমাধান → সেই সমাধান থেকে নতুন সমস্যা → …
   প্রতি পেজে একটাই বিষয়। এনিমেশন নিজে চলে, পেজ ইউজারের হাতে।
   ============================================================ */
:root{
  --ground:#0B0E15;
  --panel:#141926;
  --panel-2:#1A2030;
  --line:#28303F;
  --line-soft:#1E2532;
  --ink:#E9EDF6;
  --ink-2:#AEB7C9;
  --muted:#7A8496;
  --redis:#3FC9C0; --redis-dim:#1C6D68;
  --pg:#9A8CF0;    --pg-dim:#463C82;
  --work:#F5A63C;  --work-dim:#8A5F22;
  --bad:#E2607A;   --bad-dim:#7A3448;
  --ok:#7BD88F;    --ok-dim:#2E6B44;
}
*{box-sizing:border-box}
body{
  background:var(--ground);color:var(--ink);
  font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  margin:0;min-height:100vh;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.deck{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  background:var(--ground);
  overflow:hidden;--u:1vw;
}
@supports (container-type:size){ .deck{container-type:size; --u:1cqw} }

/* the page's mood is the story beat: a problem, or the fix for it */
.deck[data-k="prob"]{background:radial-gradient(120% 85% at 50% -10%, rgba(226,96,122,.12), transparent 62%), var(--ground)}
.deck[data-k="sol"]{background:radial-gradient(120% 85% at 50% -10%, rgba(63,201,192,.11), transparent 62%), var(--ground)}
.deck[data-k="setup"]{background:radial-gradient(120% 85% at 50% -10%, rgba(245,166,60,.10), transparent 62%), var(--ground)}

.page{
  position:absolute;inset:0;
  padding:calc(var(--u) * 3.0) calc(var(--u) * 4.0) calc(var(--u) * 4.6);
  display:none;flex-direction:column;gap:calc(var(--u) * 1.25);
}
.page.on{display:flex}

/* ---------- head ---------- */
.eye{
  font-family:"JetBrains Mono",monospace;
  font-size:calc(var(--u) * .92);letter-spacing:.2em;text-transform:uppercase;
  display:flex;align-items:center;gap:calc(var(--u) * .85);
}
.eye .step{color:var(--muted)}
.eye .chip{
  padding:calc(var(--u) * .2) calc(var(--u) * .7);border-radius:99px;
  font-weight:700;letter-spacing:.16em;
}
.prob .eye .chip{color:var(--bad);border:1px solid var(--bad-dim);background:rgba(226,96,122,.07)}
.sol  .eye .chip{color:var(--ok);border:1px solid var(--ok-dim);background:rgba(123,216,143,.07)}
.setup .eye .chip{color:var(--work);border:1px solid var(--work-dim);background:rgba(245,166,60,.07)}
.page h2{
  font-family:"Anek Bangla","Hind Siliguri",sans-serif;
  font-size:calc(var(--u) * 3.0);font-weight:700;margin:0;line-height:1.12;
  letter-spacing:-.012em;text-wrap:balance;max-width:30ch;
}
.prob h2 em{font-style:normal;color:var(--bad)}
.sol h2 em{font-style:normal;color:var(--ok)}
.setup h2 em{font-style:normal;color:var(--work)}
.page .sub{
  margin:0;font-size:calc(var(--u) * 1.42);color:var(--ink-2);
  font-weight:300;max-width:88ch;line-height:1.45;
}
.page .sub b{color:var(--ink);font-weight:600}

/* ---------- the running scene ---------- */
.scene{
  position:relative;flex:1 1 auto;min-height:calc(var(--u) * 18);
  border-radius:calc(var(--u) * .6);
  background:#080B11;border:1px solid var(--line-soft);overflow:hidden;
}
.scene::before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:calc(var(--u) * 2.4) calc(var(--u) * 2.4);opacity:.45;
}
.page:not(.on) .scene *{animation:none !important}

.bx{
  position:absolute;transform:translate(-50%,-50%);
  border:1px solid var(--line);background:var(--panel-2);
  border-radius:calc(var(--u) * .32);
  padding:calc(var(--u) * .62) calc(var(--u) * 1.05);
  font-family:"JetBrains Mono",monospace;font-size:calc(var(--u) * 1.24);
  color:var(--ink-2);white-space:nowrap;text-align:center;line-height:1.3;
}
.bx i{display:block;font-style:normal;font-size:calc(var(--u) * .98);color:var(--muted);letter-spacing:.06em;margin-top:calc(var(--u) * .1)}
.bx.r{border-color:var(--redis-dim);color:var(--redis)}
.bx.p{border-color:var(--pg-dim);color:var(--pg)}
.bx.w{border-color:var(--work-dim);color:var(--work)}
.bx.g{border-color:var(--ok-dim);color:var(--ok)}
.bx.x{border-color:var(--bad-dim);color:var(--bad)}
.bx.big{font-size:calc(var(--u) * 1.5);padding:calc(var(--u) * .7) calc(var(--u) * 1.2)}

.wire{position:absolute;height:2px;background:var(--line);transform:translateY(-50%)}
.wire.v{width:2px;transform:translateX(-50%)}
.wire.d{background:repeating-linear-gradient(90deg,var(--line) 0 7px,transparent 7px 14px)}
.wire.rd{background:var(--redis-dim)}
.wire.bd{background:var(--bad-dim)}

.dot{
  position:absolute;width:calc(var(--u) * .95);height:calc(var(--u) * .95);
  border-radius:50%;background:var(--work);transform:translate(-50%,-50%);
  box-shadow:0 0 calc(var(--u) * 1.1) rgba(245,166,60,.6);
  left:var(--a, 50%);
}
.dot.r{background:var(--redis);box-shadow:0 0 calc(var(--u) * 1.1) rgba(63,201,192,.6)}
.dot.g{background:var(--ok);box-shadow:0 0 calc(var(--u) * 1.1) rgba(123,216,143,.6)}
.dot.x{background:var(--bad);box-shadow:0 0 calc(var(--u) * 1.1) rgba(226,96,122,.6)}
.dot.p{background:var(--pg);box-shadow:0 0 calc(var(--u) * 1.1) rgba(154,140,240,.6)}
.dot.q{background:#5B6478;box-shadow:none}
.dot.sq{border-radius:calc(var(--u) * .16)}
.dot.lg{width:calc(var(--u) * 1.45);height:calc(var(--u) * 1.45)}
.dot.sm{width:calc(var(--u) * .66);height:calc(var(--u) * .66);box-shadow:none}

.stamp{
  position:absolute;transform:translate(-50%,-50%) rotate(-4deg);
  font-family:"JetBrains Mono",monospace;
  font-size:calc(var(--u) * 1.75);letter-spacing:.14em;
  border:2px solid var(--bad);color:var(--bad);
  padding:calc(var(--u) * .3) calc(var(--u) * .85);
  border-radius:calc(var(--u) * .25);opacity:0;background:rgba(11,14,21,.85);
}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
.stamp.w{border-color:var(--work);color:var(--work)}

.meter{position:absolute;height:calc(var(--u) * .8);background:var(--panel-2);border:1px solid var(--line);border-radius:99px;overflow:hidden;transform:translateY(-50%)}
.meter > b{display:block;height:100%;width:0;background:var(--bad);border-radius:99px}
.meter.g > b{background:var(--ok)}
.meter.r > b{background:var(--redis)}

.col{position:absolute;bottom:8%;transform:translateX(-50%);border-radius:2px 2px 0 0}
.txt{
  position:absolute;transform:translate(-50%,-50%);
  font-family:"JetBrains Mono",monospace;font-size:calc(var(--u) * 1.16);
  color:var(--muted);white-space:nowrap;
}
.txt.b{color:var(--bad)} .txt.o{color:var(--ok)} .txt.r{color:var(--redis)} .txt.w{color:var(--work)}
.txt.lg{font-size:calc(var(--u) * 1.6);color:var(--ink)}

/* ---------- bullets ---------- */
.pts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:calc(var(--u) * 2.2);margin:0;padding:0;list-style:none;flex:0 0 auto}
.pts li{
  position:relative;padding-left:calc(var(--u) * 1.5);
  font-size:calc(var(--u) * 1.24);color:var(--ink-2);font-weight:300;line-height:1.42;
}
.pts li::before{content:"";position:absolute;left:0;top:calc(var(--u) * .62);width:calc(var(--u) * .55);height:2px;background:var(--muted)}
.prob .pts li::before{background:var(--bad)}
.sol .pts li::before{background:var(--ok)}
.setup .pts li::before{background:var(--work)}
.pts b{color:var(--ink);font-weight:600}
.mono{font-family:"JetBrains Mono",monospace;font-size:.9em}

/* ---------- chain rail ---------- */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:calc(var(--u) * 1.0);padding:0 calc(var(--u) * 4.0) calc(var(--u) * 1.4)}
.btn{
  font-family:"JetBrains Mono",monospace;font-size:calc(var(--u) * .95);
  color:var(--ground);background:var(--redis);border:1px solid var(--redis);
  border-radius:calc(var(--u) * .32);padding:calc(var(--u) * .46) calc(var(--u) * 1.0);
  cursor:pointer;font-weight:700;white-space:nowrap;
}
.btn.ghost{color:var(--ink-2);background:var(--panel);border-color:var(--line);font-weight:400}
.btn:focus-visible{outline:2px solid var(--work);outline-offset:2px}
.rail{display:flex;gap:calc(var(--u) * .18);flex:1;align-items:center}
.pd{flex:1 1 auto;height:calc(var(--u) * .36);border:0;border-radius:99px;padding:0;cursor:pointer;background:#232B39;transition:background .2s,transform .2s}
.pd[data-k="prob"]{background:var(--bad-dim)}
.pd[data-k="sol"]{background:var(--ok-dim)}
.pd[data-k="setup"]{background:var(--work-dim)}
.pd.on{transform:scaleY(2.2)}
.pd.on[data-k="prob"]{background:var(--bad)}
.pd.on[data-k="sol"]{background:var(--ok)}
.pd.on[data-k="setup"]{background:var(--work)}
.keys{font-family:"JetBrains Mono",monospace;font-size:calc(var(--u) * .8);color:var(--muted);white-space:nowrap}

@keyframes travel{0%{left:var(--a);opacity:0}8%{opacity:1}92%{opacity:1}100%{left:var(--b);opacity:0}}
@keyframes keep{0%{left:var(--a);opacity:0}12%{opacity:1}100%{left:var(--b);opacity:1}}
@keyframes back{0%{left:var(--a);opacity:0}12%{opacity:1}46%{left:var(--b)}54%{left:var(--b)}88%{opacity:1}100%{left:var(--a);opacity:0}}
@keyframes vdrop{0%{top:var(--a);opacity:0}10%{opacity:1}90%{opacity:1}100%{top:var(--b);opacity:0}}
@keyframes flash{0%,52%{opacity:0;transform:translate(-50%,-50%) rotate(-4deg) scale(1.5)}62%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1)}94%{opacity:1}100%{opacity:0}}
@keyframes fill{0%{width:0}75%{width:100%}100%{width:100%}}
@keyframes creep{0%{width:0}100%{width:9%}}
@keyframes hold{0%,100%{opacity:.28;transform:translate(-50%,-50%) scale(.72)}50%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes swell{0%,100%{box-shadow:0 0 0 rgba(226,96,122,0)}50%{box-shadow:0 0 calc(var(--u) * 2.4) rgba(226,96,122,.5)}}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-52.5%,-50%)}75%{transform:translate(-47.5%,-50%)}}
@keyframes rise{0%{height:10%}100%{height:var(--h)}}
@keyframes sweepx{0%{left:4%}100%{left:90%}}
@keyframes dimOut{0%,55%{opacity:1}72%,100%{opacity:.18}}
@keyframes popIn{0%,50%{opacity:0;transform:translate(-50%,-50%) scale(.7)}62%,100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes popOut{0%,45%{opacity:1}58%,100%{opacity:0}}
@keyframes drift{0%{opacity:0;transform:translate(-50%,-50%) scale(1)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(.6)}}

@media (prefers-reduced-motion:reduce){
  .scene *{animation-duration:.001ms !important;animation-iteration-count:1 !important}
  .stamp{opacity:1}
}
</style>

<div class="deck" id="deck" data-k="setup">
  <nav class="nav">
    <button class="btn ghost" id="prevBtn" type="button">◀ আগের</button>
    <button class="btn" id="nextBtn" type="button">পরের ▶</button>
    <div class="rail" id="rail"></div>
    <span class="keys">← → পেজ · F ফুলস্ক্রিন</span>
  </nav>
</div>

<script>
(() => {
"use strict";

/* ---- scene builders: everything is a % inside the scene box ---- */
const bx  = (c,x,y,l,s="") => `<div class="bx ${c}" style="left:${x}%;top:${y}%">${l}${s?`<i>${s}</i>`:""}</div>`;
const w   = (x,y,ww,c="")  => `<div class="wire ${c}" style="left:${x}%;top:${y}%;width:${ww}%"></div>`;
const dot = (c,a,b,y,an)   => `<div class="dot ${c}" style="--a:${a}%;--b:${b}%;top:${y}%;animation:${an}"></div>`;
const hold= (c,x,y,d,dur=3)=> `<div class="dot ${c}" style="left:${x}%;top:${y}%;animation:hold ${dur}s ease-in-out infinite ${d}s"></div>`;
const stm = (c,x,y,t,an)   => `<div class="stamp ${c}" style="left:${x}%;top:${y}%;animation:${an}">${t}</div>`;
const txt = (c,x,y,t)      => `<div class="txt ${c}" style="left:${x}%;top:${y}%">${t}</div>`;
const mtr = (c,x,y,ww,an)  => `<div class="meter ${c}" style="left:${x}%;top:${y}%;width:${ww}%"><b style="animation:${an}"></b></div>`;
const col = (bg,x,h,d,dur=3.4)=> `<div class="col" style="left:${x}%;width:5.2%;--h:${h}%;height:${h}%;background:${bg};animation:rise ${dur}s ease-out infinite ${d}s"></div>`;
/* a field of user devices */
const field = (x0,y0,cols,rows,dx,dy,cls,dur) => {
  let o = "";
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++)
    o += hold(cls+" sm", x0+c*dx, y0+r*dy, ((r*cols+c)%9)*0.18, dur);
  return o;
};
/* a burst of dots all travelling the same path */
const burst = (c,a,b,y0,rows,dy,dur,stagger) => {
  let o = "";
  for (let i=0;i<rows;i++) o += dot(c,a,b,y0+i*dy,`travel ${dur}s linear infinite ${(i*stagger).toFixed(2)}s`);
  return o;
};

const RED = "var(--bad)", GRN = "var(--ok-dim)", TEAL = "var(--redis-dim)";

/* ══════════════ THE CHAIN ══════════════════════════════════ */
const P = [

{ k:"setup", eye:"শুরু", chip:"উদাহরণ",
  h:'তোমার অ্যাপে <em>৫,০০,০০০</em> ইউজার',
  s:'প্রত্যেকের FCM টোকেন ডাটাবেজে সেভ করা আছে। অ্যাডমিন এখন <b>একটা নোটিফিকেশন সবাইকে</b> পাঠাতে চায়। এই একটামাত্র কাজ থেকেই পুরো গল্পটা শুরু।',
  sc: bx("w",10,50,"ADMIN","পাঠাও ▸") + w(17,50,11)
    + bx("",34,50,"API","/broadcast") + w(41,50,10)
    + bx("p",56,50,"POSTGRES","৫,০০,০০০ টোকেন")
    + field(72,20,7,5,4,15,"q",3.2)
    + txt("w",86,88,"৫ লাখ ডিভাইস")
    + dot("",18,32,50,"travel 3.2s linear infinite")
    + dot("p",43,53,50,"travel 3.2s linear infinite .8s"),
  p:['প্রতিটা ডিভাইসের <b>একটা করে FCM টোকেন</b> — ফোন, ট্যাব, ব্রাউজার আলাদা',
     'অ্যাডমিন এক ক্লিক করবে, বাকিটা ব্যাকএন্ডের দায়িত্ব',
     'প্রশ্ন একটাই — <b>এই ৫ লাখে পৌঁছাব কীভাবে?</b>'] },

{ k:"prob", eye:"ধাপ ০১", chip:"সমস্যা",
  h:'সোজা API-তেই <em>লুপ চালালে</em> কী হয়',
  s:'সবচেয়ে সহজ কোডটা এটাই — টোকেনগুলো নিয়ে এসো, একটা <span class="mono">for</span> লুপে একটার পর একটা পাঠাও। রিকোয়েস্টটা ততক্ষণ খোলা থাকে।',
  sc: bx("",13,42,"API","for (const t of tokens)") + w(21,42,58)
    + bx("x",85,42,"৫ লাখ ফোন","")
    + dot("",23,80,42,"keep 11s linear infinite")
    + dot("",23,80,42,"keep 11s linear infinite 3.6s")
    + dot("",23,80,42,"keep 11s linear infinite 7.2s")
    + mtr("",13,76,66,"creep 11s linear infinite")
    + txt("b",13,88,"পাঠানো হয়েছে: ৩,২১৪ / ৫,০০,০০০")
    + txt("",70,88,"সময় গেছে: ১০ মিনিট ৪২ সেকেন্ড"),
  p:['একটা FCM কল ≈ <b>২০০ মিলিসেকেন্ড</b>',
     '৫,০০,০০০ × ২০০ms = <b>প্রায় ২৭ ঘণ্টা</b>',
     'আর এই পুরো সময় <b>HTTP রিকোয়েস্টটা খোলা</b> থাকতে হবে'] },

{ k:"prob", eye:"ধাপ ০২", chip:"সমস্যা",
  h:'৩০ সেকেন্ডেই <em>ফেল</em> — কে পেয়েছে জানার উপায় নেই',
  s:'Nginx কানেকশন কেটে দিল, প্রসেসটা মরে গেল। এখন সবচেয়ে খারাপ প্রশ্নটা — <b>কার কার কাছে গিয়েছিল?</b>',
  sc: bx("x",13,40,"API","কানেকশন কাটা") + w(21,40,26,"bd")
    + stm("",40,40,"TIMEOUT","flash 6s linear infinite")
    + txt("o",60,14,"✓ পেয়েছে — ৩,২১৪")
    + field(56,26,3,1,3.6,0,"g",3)
    + txt("b",70,44,"? জানা নেই — ৪,৯৬,৭৮৬")
    + field(52,58,13,4,3.6,12,"q",3)
    + dot("x",23,44,40,"travel 6s linear infinite"),
  p:['কোথায় থেমেছে তার <b>কোনো রেকর্ড নেই</b> — সবটা মেমোরিতে ছিল',
     'আবার চালালে প্রথম ৩,২১৪ জন <b>দুইবার</b> পাবে',
     'না চালালে বাকি ৪.৯৬ লাখ <b>কখনোই পাবে না</b>'] },

{ k:"sol", eye:"ধাপ ০৩", chip:"সমাধান",

/* ══════════════ render + page control ═════════════════════ */
const deck = document.getElementById("deck");
const rail = document.getElementById("rail");
const bn = (v) => String(v).replace(/\d/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);

P.forEach((pg, n) => {
  const el = document.createElement("section");
  el.className = `page ${pg.k}`;
  el.innerHTML =
    `<div class="eye"><span class="chip">${pg.chip}</span>` +
      `<span class="step">${pg.eye} · ${bn(n + 1)}/${bn(P.length)}</span></div>` +
    `<h2>${pg.h}</h2>` +
    `<p class="sub">${pg.s}</p>` +
    `<div class="scene">${pg.sc}</div>` +
    `<ul class="pts">${pg.p.map((t) => `<li>${t}</li>`).join("")}</ul>`;
  deck.insertBefore(el, deck.querySelector(".nav"));

  const d = document.createElement("button");
  d.className = "pd"; d.type = "button"; d.dataset.k = pg.k;
  d.setAttribute("aria-label", `${pg.chip} — ${pg.eye}`);
  d.addEventListener("click", () => show(n));
  rail.appendChild(d);
});

const pages = [...deck.querySelectorAll(".page")];
const pds = [...rail.children];
let i = 0;

function show(n) {
  i = (n + pages.length) % pages.length;
  pages.forEach((p, k) => p.classList.toggle("on", k === i));
  pds.forEach((d, k) => d.classList.toggle("on", k === i));
  deck.dataset.k = P[i].k;
}

document.getElementById("prevBtn").addEventListener("click", () => show(i - 1));
document.getElementById("nextBtn").addEventListener("click", () => show(i + 1));
document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowRight" || k === " " || k === "PageDown") { e.preventDefault(); show(i + 1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); show(i - 1); }
  else if (k === "Home") show(0);
  else if (k === "End") show(pages.length - 1);
  else if (k === "f" || k === "F") {
    document.fullscreenElement ? document.exitFullscreen() : deck.requestFullscreen?.();
  }
});

show(0);
})();
</script>
